name: Wrong or misattributed item
description: An item on the wrong person, a bad summary, a dead link
title: "[item] "
labels: ["data-quality"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — this is the most useful kind of report we get. Every item was
        judged individually, so a wrong one means the judgement was wrong, and
        we want to know.
  - type: input
    id: person
    attributes:
      label: Person
      description: The `person_id` from the data, e.g. `yann-lecun`
      placeholder: yann-lecun
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: The item's URL
      description: The `url` field of the item, so we can find it exactly
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong
      options:
        - Not this person (misattributed)
        - Summary is inaccurate or misleading
        - Link is dead or wrong
        - Wrong panel (output vs event)
        - Wrong date
        - Not substantive / should not be here
        - Something else
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: What it says now, what it should say, and how you know.
    validations:
      required: true
